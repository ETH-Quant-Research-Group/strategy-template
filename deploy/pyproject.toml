[project]
name = "strategy-deploy"
version = "0.1.0"
description = "Packages a strategy from ../strategies into a deployable image"
requires-python = ">=3.11"
dependencies = [
    # Pinned to a commit SHA, not a branch, so a build today and a build in
    # six months install the exact same engine/guard/runner code. Bumping
    # this is a deliberate, reviewed act — not something needed to iterate
    # on strategy logic.
    #
    # This SHA is Infrastructure's main after PR #22, the first with
    # interfaces/metrics.py (BaseStrategy.metrics(), which
    # strategies/strategy.py uses). Pin to commits on main: a SHA that only
    # lived on a branch can be rebased away, and that breaks every build here.
    "infrastructure @ git+https://github.com/ETH-Quant-Research-Group/Infrastructure.git@82140bc96893180c36d018b26ece6de4e6e279ef",
]

[tool.uv.sources]
# Infrastructure's own pyproject.toml pins lighter-sdk to this git fork via
# the same mechanism. That pin does NOT propagate through the built wheel's
# metadata, so it has to be repeated here or uv will happily resolve
# lighter-sdk==1.1.2 from PyPI instead — which may not match what
# Infrastructure was actually built and tested against.
lighter-sdk = { git = "https://github.com/elliottech/lighter-python.git" }
